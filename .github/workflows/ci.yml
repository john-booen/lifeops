name: LifeOps isolated verification

on:
  workflow_dispatch:
    inputs:
      native_task_content:
        description: Run fictional native task-edit QA on remote desktops
        type: boolean
        default: false
      native_scenario:
        description: Native fictional scenario to exercise
        type: choice
        default: task_content
        options: [task_content, devices]
      candidate_ref:
        description: Exact accepted candidate source commit
        type: string
        default: ""
      expected_main_sha256:
        description: Expected locally sealed main.js SHA-256
        type: string
        default: ""
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: lifeops-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.native_task_content && 'native' || 'verify' }}
  cancel-in-progress: true

jobs:
  source-plan:
    if: github.event_name != 'workflow_dispatch' || !inputs.native_task_content
    runs-on: macos-15-intel
    timeout-minutes: 5
    outputs:
      reuse: ${{ steps.plan.outputs.reuse }}
      run_id: ${{ steps.plan.outputs.run_id }}
      run_attempt: ${{ steps.plan.outputs.run_attempt }}
      artifact_id: ${{ steps.plan.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/source-ci-reuse.mjs

  verify:
    needs: source-plan
    if: needs.source-plan.outputs.reuse != 'true'
    # Keep the full instrumented suite on its reviewed native ARM64 timing baseline.
    # The lightweight audit uses Intel, avoiding a second ARM64 queue.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - name: Check public source boundary
        run: npm run verify:privacy
      - name: Check public Git history
        run: npm run verify:privacy -- --history
      - run: npm ci --ignore-scripts --no-audit
      - name: Tests, measured coverage gate and isolated production package
        run: node scripts/verify-source-ci.mjs --output "$RUNNER_TEMP/source-ci-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: source-ci-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/source-ci-evidence
          if-no-files-found: error
          retention-days: 30

  dependency-audit:
    needs: source-plan
    if: needs.source-plan.outputs.reuse != 'true'
    # The hosted arm64 queue also cancelled audits before allocating a runner.
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - name: Prepare fixed official tool and fresh public npm database
        run: node scripts/offline-osv-audit.mjs --prepare "$RUNNER_TEMP/lifeops-osv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Block high and critical advisories with inventory isolated from network
        run: node scripts/offline-osv-audit.mjs --scan "$RUNNER_TEMP/lifeops-osv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE/package-lock.json"

  reuse-evidence:
    needs: source-plan
    if: needs.source-plan.outputs.reuse == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.source-plan.outputs.artifact_id }}
          run-id: ${{ needs.source-plan.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-ci-evidence
          merge-multiple: true
      - name: Verify original reports, coverage provenance and package without rerunning tests
        env:
          SOURCE_CI_RUN_ID: ${{ needs.source-plan.outputs.run_id }}
          SOURCE_CI_RUN_ATTEMPT: ${{ needs.source-plan.outputs.run_attempt }}
        run: node scripts/ci-evidence.mjs --reuse "$RUNNER_TEMP/source-ci-evidence" "$GITHUB_SHA"

  native-task-content:
    if: github.event_name == 'workflow_dispatch' && inputs.native_task_content
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.5.8
            asset: Obsidian-1.5.8-universal.dmg
            digest: ""
          - version: 1.12.7
            asset: Obsidian-1.12.7.dmg
            digest: 3b85c13b4ce55512e86e170a7cd2a494e2db695ac888c0601e153cb85b77881b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - name: Prepare the sealed candidate and synthetic automation
        working-directory: candidate
        run: |
          npm ci --ignore-scripts --no-audit
          node esbuild.config.mjs production --outfile "$RUNNER_TEMP/candidate-main.js"
          node scripts/prepare-plugin-package.mjs --bundle "$RUNNER_TEMP/candidate-main.js" --output "$RUNNER_TEMP/candidate-package"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/automation" --ignore-scripts --no-audit --no-fund playwright@1.65.1
      - name: Prepare official Obsidian and the published rollback package
        env:
          APP_VERSION: ${{ matrix.version }}
          APP_ASSET: ${{ matrix.asset }}
          APP_DIGEST: ${{ matrix.digest }}
          QA_SCENARIO: ${{ inputs.native_scenario }}
        run: |
          curl --fail --location --retry 2 "https://github.com/obsidianmd/obsidian-releases/releases/download/v$APP_VERSION/$APP_ASSET" --output "$RUNNER_TEMP/Obsidian.dmg"
          if [ -n "$APP_DIGEST" ]; then echo "$APP_DIGEST  $RUNNER_TEMP/Obsidian.dmg" | shasum -a 256 --check; fi
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/ObsidianMount" "$RUNNER_TEMP/Obsidian.dmg"
          test "$(/usr/libexec/PlistBuddy -c Print:CFBundleShortVersionString "$RUNNER_TEMP/ObsidianMount/Obsidian.app/Contents/Info.plist")" = "$APP_VERSION"
          ROLLBACK_VERSION=0.5.98
          ROLLBACK_SHA=5db520d5bb8417aedb7cf555c90f839c66d7ec262bf921527e29cab9ba0dace2
          if [ "$QA_SCENARIO" = devices ]; then ROLLBACK_VERSION=0.5.100; ROLLBACK_SHA=2dfb98f5bb311d6b07ed34499ac94349f0f4573042bd0fa5083505ad31fb3e7c; fi
          curl --fail --location --retry 2 "https://github.com/john-booen/lifeops/releases/download/$ROLLBACK_VERSION/lifeops-assistant-$ROLLBACK_VERSION.zip" --output "$RUNNER_TEMP/rollback.zip"
          echo "$ROLLBACK_SHA  $RUNNER_TEMP/rollback.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/rollback.zip" -d "$RUNNER_TEMP/rollback-package"
          if [ "$QA_SCENARIO" = devices ]; then
            curl --fail --location --retry 2 "https://github.com/john-booen/lifeops/releases/download/0.5.128/lifeops-assistant-0.5.128.zip" --output "$RUNNER_TEMP/previous-daily.zip"
            echo "338574f3b44c7a0902b2b5ca7d592098ba3df1aebb9c45efc431f0dd2065dc79  $RUNNER_TEMP/previous-daily.zip" | shasum -a 256 --check
            unzip -q "$RUNNER_TEMP/previous-daily.zip" -d "$RUNNER_TEMP/previous-daily-package"
          fi
      - name: Exercise actual chat, bare confirmation, reopen and rollback in a native fixture
        env:
          TZ: Asia/Shanghai
          LIFEOPS_QA_SOURCE: ${{ github.workspace }}/candidate
          LIFEOPS_QA_PACKAGE: ${{ runner.temp }}/candidate-package
          LIFEOPS_QA_ROLLBACK: ${{ runner.temp }}/rollback-package
          LIFEOPS_QA_PREVIOUS_DAILY: ${{ runner.temp }}/previous-daily-package
          LIFEOPS_QA_AUTOMATION_PACKAGE: ${{ runner.temp }}/automation/package.json
          LIFEOPS_NATIVE_APP: ${{ runner.temp }}/ObsidianMount/Obsidian.app
          LIFEOPS_QA_NATIVE_VERSION: ${{ matrix.version }}
          LIFEOPS_QA_EXPECTED_SHA: ${{ inputs.expected_main_sha256 }}
          LIFEOPS_QA_SCENARIO: ${{ inputs.native_scenario }}
        run: node harness/scripts/eval/native-task-content.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-task-content-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/native-task-content-*/result.json
            ${{ runner.temp }}/native-task-content-*/*.png
            ${{ runner.temp }}/native-task-content-*/*.log
          if-no-files-found: warn
