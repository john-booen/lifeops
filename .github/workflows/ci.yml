name: LifeOps isolated verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: lifeops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - name: Check public source boundary
        run: npm run verify:privacy
      - name: Check public Git history
        run: npm run verify:privacy -- --history
      - run: npm ci --ignore-scripts --no-audit
      - name: Tests, measured coverage gate and isolated production package
        run: node scripts/verify-ci-local.mjs --run

  dependency-audit:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
      - name: Prepare fixed official tool and fresh public npm database
        run: node scripts/offline-osv-audit.mjs --prepare "$RUNNER_TEMP/lifeops-osv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Block high and critical advisories with inventory isolated from network
        run: node scripts/offline-osv-audit.mjs --scan "$RUNNER_TEMP/lifeops-osv-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKSPACE/package-lock.json"
