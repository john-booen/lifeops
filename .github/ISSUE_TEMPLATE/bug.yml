name: 问题反馈
description: 用一组虚构数据说明问题
body:
  - type: input
    id: version
    attributes:
      label: LifeOps 版本、Obsidian 版本与操作系统
      description: Obsidian 的「设置 → 关于」会显示应用版本和安装器版本，请一起填上。
      placeholder: 例如 LifeOps 0.5.9 / Obsidian 1.15.1 / 安装器 1.12.7 / macOS
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 复现步骤、期望与实际行为
      description: 请使用虚构任务和匿名截图，勿附原日记、绝对路径或 API Key。
    validations:
      required: true
